type: custom:button-card
entity: climate.ac_living_room
aspect_ratio: 1/1
show_name: false
show_state: false
show_icon: false

# Tap = toggle on/off (turn_on resumes the unit's last mode). Hold = more-info.
tap_action:
  action: call-service
  service: |
    [[[ return entity.state === 'off' ? 'climate.turn_on' : 'climate.turn_off'; ]]]
  target:
    entity_id: climate.ac_living_room
hold_action:
  action: more-info

# The AC-unit graphic, defined ONCE. currentColor lets each mode recolor it.
custom_fields:
  mode_graphic: |
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%">
      <rect x="16" y="26" width="68" height="26" rx="8"/>
      <path d="M16 44 H84"/>
      <path d="M26 35 H42"/>
      <path d="M34 66 q8 -9 16 0 t16 0"/>
      <path d="M38 80 q6 -7 12 0 t12 0"/>
    </svg>

styles:
  card:
    - padding: 0px
    - background-color: "#000000"
  grid:
    - position: relative
  custom_fields:
    mode_graphic:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 85%
      - height: 85%
      - color: "#6B6E70"          # off / default — dim grey

state:
  - value: heat
    styles:
      custom_fields:
        mode_graphic:
          - color: "#FF6B35"
          - filter: drop-shadow(0 0 8px rgba(255, 107, 53, 0.55))

  - value: cool
    styles:
      custom_fields:
        mode_graphic:
          - color: "#00A1E4"
          - filter: drop-shadow(0 0 8px rgba(0, 161, 228, 0.55))

  - value: dry
    styles:
      custom_fields:
        mode_graphic:
          - color: "#26C6DA"
          - filter: drop-shadow(0 0 8px rgba(38, 198, 218, 0.5))

  - value: auto
    styles:
      custom_fields:
        mode_graphic:
          - color: "#34C759"
          - filter: drop-shadow(0 0 8px rgba(52, 199, 89, 0.5))

  # `off` and any unlisted mode (heat_cool, fan_only) use the grey default above.
