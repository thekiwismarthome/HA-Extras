type: custom:button-card
# Change this to your light entity:
entity: light.living_room_ceiling
aspect_ratio: 1/1
show_name: false
show_state: false
show_icon: false

# Tap = toggle on/off. Hold = more-info.
tap_action:
  action: toggle
hold_action:
  action: more-info

# Flush-mount ceiling light (dome + light rays). currentColor is set per state below.
custom_fields:
  light_graphic: |
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%">
      <path d="M22 20 H78"/>
      <path d="M33 20 A17 12 0 0 0 67 20"/>
      <path d="M50 39 V55"/>
      <path d="M42 40 L38 54"/>
      <path d="M58 40 L62 54"/>
      <path d="M34 41 L29 53"/>
      <path d="M66 41 L71 53"/>
    </svg>

styles:
  card:
    - padding: 0px
    - background-color: "#000000"
  grid:
    - position: relative
  custom_fields:
    light_graphic:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 85%
      - height: 85%
      # Warm when on, dim grey when off.
      - color: |
          [[[ return entity.state === 'on' ? '#FFC65C' : '#6B6E70'; ]]]
      # Icon fades a little at low brightness (0.55 .. 1.0).
      - opacity: |
          [[[
            if (entity.state !== 'on') return '1';
            const b = entity.attributes.brightness || 255;
            return (0.55 + (b / 255) * 0.45).toFixed(2);
          ]]]
      # Glow blur + strength scale with brightness (off = no glow).
      - filter: |
          [[[
            if (entity.state !== 'on') return 'none';
            const b = entity.attributes.brightness || 255;
            const p = b / 255;
            const blur = (4 + p * 12).toFixed(1);
            const op = (0.25 + p * 0.5).toFixed(2);
            return 'drop-shadow(0 0 ' + blur + 'px rgba(255,198,92,' + op + '))';
          ]]]
