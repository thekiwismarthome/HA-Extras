# KSH Style — Intercom Call Card (Kiosk Satellite)
# =============================================================================
#  Rings another Kiosk Satellite from THIS tablet. Per the Kiosk Satellite docs,
#  you call your OWN kiosk's action and pass the TARGET's name in `kiosk`:
#     action: esphome.<this_node>_intercom_call   data: { kiosk: <target name> }
#  Hang up:  esphome.<this_node>_intercom_hangup  (no data)
#
#  >>> CONFIGURE the two variables below:
#      call_service = THIS tablet's own intercom_call action
#      targets      = friendly names of the OTHER kiosks to ring (exactly as
#                     the kiosk field expects, e.g. "Ella's Assistant").
#      (Names can't be auto-derived reliably — "ks_ella_s_assistant" -> the
#       apostrophe in "Ella's Assistant" is lost — so list them explicitly.)
# =============================================================================
type: custom:button-card
show_name: false
show_state: false
show_icon: false
tap_action:
  action: none
variables:
  call_service: esphome.ks_office_tablet_intercom_call   # <- THIS tablet's own action
  targets:                                               # <- other kiosks to ring
    - Ella's Assistant
    - Kitchen Tablet
custom_fields:
  list: |
    [[[
      const PHONE = `<svg viewBox="0 0 24 24" style="width:1.4em;height:1.4em;vertical-align:middle;fill:currentColor"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>`;
      const HANGUP = `<svg viewBox="0 0 24 24" style="width:1.4em;height:1.4em;vertical-align:middle;fill:currentColor"><path d="M12,9C10.4,9 8.85,9.25 7.4,9.72V12.82C7.4,13.22 7.17,13.56 6.84,13.72C5.86,14.21 4.97,14.84 4.17,15.57C4,15.75 3.75,15.86 3.5,15.86C3.2,15.86 2.95,15.74 2.77,15.56L0.29,13.08C0.11,12.9 0,12.65 0,12.36C0,12.06 0.12,11.81 0.3,11.63C3.34,8.78 7.46,7 12,7C16.54,7 20.66,8.78 23.7,11.63C23.88,11.81 24,12.06 24,12.36C24,12.65 23.89,12.9 23.71,13.08L21.23,15.56C21.05,15.74 20.8,15.86 20.5,15.86C20.25,15.86 20,15.75 19.83,15.57C19.03,14.84 18.14,14.21 17.16,13.72C16.83,13.56 16.6,13.22 16.6,12.82V9.72C15.15,9.25 13.6,9 12,9Z"/></svg>`;
      const v = variables || {};
      const svc = (v.call_service || '').split('.');
      const domain = svc[0] || 'esphome';
      const action = svc[1] || '';
      const hangup = action.replace(/_intercom_call$/, '_intercom_hangup');
      const targets = Array.isArray(v.targets) ? v.targets : [];
      let out = `<div class="ic-wrap">`;
      out += `<div class="ic-title">CALL A DEVICE</div>`;
      if (!action) out += `<div class="ic-empty">Set variables.call_service</div>`;
      else if (targets.length === 0) out += `<div class="ic-empty">No targets configured</div>`;
      targets.forEach(name => {
        const esc = String(name).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const click = `document.querySelector('home-assistant').hass.callService('${domain}','${action}',{kiosk:'${esc}'});event.stopPropagation();`;
        out += `<div class="ic-row" onpointerup="${click}"><span class="ic-ph">${PHONE}</span><span>${name}</span></div>`;
      });
      if (action) {
        const hclick = `document.querySelector('home-assistant').hass.callService('${domain}','${hangup}',{});event.stopPropagation();`;
        out += `<div class="ic-row ic-hangup" onpointerup="${hclick}"><span class="ic-ph ic-ph-red">${HANGUP}</span><span>Hang up</span></div>`;
      }
      out += `</div>`;
      return out;
    ]]]
styles:
  card:
    - padding: 0px
    - background-color: transparent
    - box-shadow: none
    - border: none
    - pointer-events: none        # let taps pass through the card's own handler
  grid:
    - width: 100%
  custom_fields:
    list:
      - width: 100%
extra_styles: |
  .ic-wrap { font-family: Antonio, 'Roboto Condensed', sans-serif;
             position: relative; z-index: 10; pointer-events: auto;
             background: rgba(12,12,12,0.97);
             border: 1px solid rgba(255,255,255,0.12);
             border-radius: 22px; padding: 18px 16px;
             box-shadow: 0 10px 34px rgba(0,0,0,0.5); }
  .ic-title { color: #8b8f93; font-weight: 600; letter-spacing: 3px;
              font-size: 15px; text-align: center; margin: 4px 0 14px; }
  .ic-row { display: flex; align-items: center; gap: 14px;
            position: relative; z-index: 10; pointer-events: auto;
            padding: 15px 16px; margin: 8px 0; border-radius: 14px;
            background: rgba(255,255,255,0.05); color: #fff;
            font-size: 21px; font-weight: 600; cursor: pointer; }
  .ic-row:active { background: rgba(52,199,89,0.18); }
  .ic-ph { color: #34C759; display: inline-flex; pointer-events: none; }
  .ic-hangup { margin-top: 14px; }
  .ic-hangup:active { background: rgba(255,59,48,0.18); }
  .ic-ph-red { color: #FF3B30; }
  .ic-empty { color: #777; text-align: center; padding: 24px; font-size: 18px; }
