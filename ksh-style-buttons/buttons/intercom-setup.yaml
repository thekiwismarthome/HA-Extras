# KSH Style — Intercom Setup (graphical config)
# =============================================================================
#  Point-and-tap config for the intercom hub. Discovers your kiosks, lets you
#  pick THIS device, choose "show all" vs individual devices, and SAVES it all
#  to a single text helper that intercom-hub.yaml reads. No YAML editing.
#
#  SETUP (once):
#    Create a Text helper (Settings -> Devices & Services -> Helpers -> Text)
#    with entity id  input_text.intercom_config  and MAX LENGTH 255.
#    (Or change config_entity below to your helper's id.)
# =============================================================================
type: custom:button-card
show_name: false
show_state: false
show_icon: false
tap_action:
  action: none
triggers_update: all
variables:
  config_entity: input_text.intercom_config
custom_fields:
  setup: |
    [[[
      const CHK = `<svg viewBox="0 0 24 24" class="icn"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>`;
      const DOT = `<svg viewBox="0 0 24 24" class="icn"><circle cx="12" cy="12" r="8"/></svg>`;
      const H = `document.querySelector('home-assistant').hass`;
      const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
      const esc = s => String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const v = variables || {};
      const cfgEnt = v.config_entity || 'input_text.intercom_config';
      const raw = hass.states[cfgEnt] ? hass.states[cfgEnt].state : '';
      const p = (raw || '').split('~');
      const cfg = { my_device: p[0] || '', show_all: (p[1] === '1' || p.length < 2), devices: (p[2] ? p[2].split('|').filter(Boolean) : []) };

      const discovered = Object.keys(hass.states)
        .filter(id => /^sensor\..*_intercom$/.test(id))
        .map(id => { const st = hass.states[id]; const fn = (st.attributes && st.attributes.friendly_name) || id; return fn.replace(/\s*intercom$/i,'').trim(); })
        .filter((n,i,a) => a.indexOf(n) === i).sort();

      const compose = c => [c.my_device || '', c.show_all ? '1' : '0', (c.devices || []).join('|')].join('~');
      const write = val => `var h=${H};h.callService('input_text','set_value',{entity_id:'${cfgEnt}',value:'${esc(val)}'});event.stopPropagation();`;

      let out = `<div class="st-wrap">`;
      out += `<div class="st-title">INTERCOM SETUP</div>`;
      if (!hass.states[cfgEnt]) out += `<div class="st-warn">Create a Text helper <b>${cfgEnt}</b> (max length 255)</div>`;
      if (discovered.length === 0) out += `<div class="st-warn">No intercom sensors found</div>`;

      out += `<div class="st-sec">THIS DEVICE</div><div class="st-pills">`;
      discovered.forEach(n => {
        const on = norm(n) === norm(cfg.my_device);
        const nc = compose(Object.assign({}, cfg, { my_device: n, devices: cfg.devices.filter(d => norm(d) !== norm(n)) }));
        out += `<span class="st-pill ${on ? 'on' : ''}" onpointerup="${write(nc)}">${on ? DOT : ''}${n}</span>`;
      });
      out += `</div>`;

      out += `<div class="st-sec">SHOW</div><div class="st-seg">`;
      out += `<span class="st-seg-opt ${cfg.show_all ? 'on' : ''}" onpointerup="${write(compose(Object.assign({}, cfg, { show_all: true })))}">All devices</span>`;
      out += `<span class="st-seg-opt ${!cfg.show_all ? 'on' : ''}" onpointerup="${write(compose(Object.assign({}, cfg, { show_all: false })))}">Choose</span>`;
      out += `</div>`;

      if (!cfg.show_all) {
        out += `<div class="st-sec">DEVICES TO SHOW</div>`;
        discovered.filter(n => norm(n) !== norm(cfg.my_device)).forEach(n => {
          const on = cfg.devices.map(norm).includes(norm(n));
          const newDevs = on ? cfg.devices.filter(d => norm(d) !== norm(n)) : cfg.devices.concat([n]);
          const nc = compose(Object.assign({}, cfg, { devices: newDevs }));
          out += `<div class="st-chk ${on ? 'on' : ''}" onpointerup="${write(nc)}"><span class="st-box">${on ? CHK : ''}</span><span>${n}</span></div>`;
        });
      }

      out += `<div class="st-foot">Changes save automatically</div>`;
      out += `</div>`;
      return out;
    ]]]
styles:
  card:
    - padding: 0px
    - background-color: transparent
    - box-shadow: none
    - border: none
    - pointer-events: none
  grid:
    - width: 100%
  custom_fields:
    setup:
      - width: 100%
extra_styles: |
  .st-wrap { font-family: Antonio, 'Roboto Condensed', sans-serif;
             position: relative; z-index: 10; pointer-events: auto;
             background: rgba(14,14,14,0.98); border: 1px solid rgba(255,255,255,0.1);
             border-radius: 22px; padding: 18px 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
  .st-title { color: #fff; font-weight: 700; letter-spacing: 4px; font-size: 20px; text-align: center; margin: 2px 0 6px; }
  .st-sec { color: #6b6e70; font-weight: 600; letter-spacing: 3px; font-size: 13px; margin: 16px 6px 8px; }
  .icn { width: 1.1em; height: 1.1em; vertical-align: middle; fill: currentColor; margin-right: 6px; }
  .st-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .st-pill { display: inline-flex; align-items: center; position: relative; z-index: 11; pointer-events: auto;
             padding: 10px 16px; border-radius: 999px; font-size: 18px; font-weight: 600;
             background: rgba(255,255,255,0.05); color: #cfd3d6; border: 1.5px solid transparent; cursor: pointer; }
  .st-pill.on { background: rgba(52,199,89,0.16); color: #fff; border-color: #34C759; }
  .st-pill.on .icn { fill: #34C759; }
  .st-seg { display: flex; gap: 8px; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 5px; }
  .st-seg-opt { flex: 1; text-align: center; position: relative; z-index: 11; pointer-events: auto;
                padding: 12px; border-radius: 10px; font-size: 18px; font-weight: 600; color: #9ba0a3; cursor: pointer; }
  .st-seg-opt.on { background: #00A1E4; color: #fff; }
  .st-chk { display: flex; align-items: center; gap: 14px; position: relative; z-index: 11; pointer-events: auto;
            padding: 13px 16px; margin: 7px 0; border-radius: 14px; background: rgba(255,255,255,0.05);
            color: #cfd3d6; font-size: 20px; font-weight: 600; cursor: pointer; }
  .st-chk.on { color: #fff; }
  .st-box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #4a4e51; display: inline-flex;
            align-items: center; justify-content: center; flex: 0 0 auto; }
  .st-chk.on .st-box { background: #34C759; border-color: #34C759; }
  .st-chk.on .st-box .icn { fill: #06260f; width: 1.2em; height: 1.2em; margin: 0; }
  .st-warn { color: #FF9F0A; text-align: center; padding: 8px 10px; font-size: 15px; }
  .st-foot { color: #6b6e70; text-align: center; font-size: 14px; margin-top: 16px; letter-spacing: 1px; }
