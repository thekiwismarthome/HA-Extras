# KSH Style — Intercom Call Picker (popup overlay)
# =============================================================================
#  A full-screen overlay that appears when input_boolean.intercom_menu is ON.
#  It auto-lists every ESPHome service matching  ks_*_intercom_call  and calls
#  the one you tap (then closes the menu). New devices appear automatically.
#
#  Place this card ANYWHERE in the same view as the phone button (it's hidden
#  until the phone button turns the helper on).
#
#  >>> Requires button-card to render templated HTML custom-fields. If the list
#      comes up blank on the tablet, that feature isn't rendering there — tell
#      Claude and switch to the manual per-device grid instead.
#
#  Needs the helper:  input_boolean.intercom_menu  (see intercom.yaml setup).
# =============================================================================
type: conditional
conditions:
  - entity: input_boolean.intercom_menu
    state: 'on'
card:
  type: custom:button-card
  show_name: false
  show_state: false
  show_icon: false
  # tap on the dimmed backdrop closes the menu
  tap_action:
    action: call-service
    service: input_boolean.turn_off
    target:
      entity_id: input_boolean.intercom_menu
  custom_fields:
    list: |
      [[[
        const PHONE = `<svg viewBox="0 0 24 24" style="width:1.4em;height:1.4em;vertical-align:middle;fill:currentColor"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>`;
        const svcs = (hass && hass.services && hass.services.esphome) ? Object.keys(hass.services.esphome) : [];
        const keys = svcs.filter(k => /^ks_.+_intercom_call$/.test(k)).sort();
        const tc = s => s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const close = `document.querySelector('home-assistant').hass.callService('input_boolean','turn_off',{entity_id:'input_boolean.intercom_menu'});`;
        let out = `<div class="ic-wrap" onclick="event.stopPropagation();">`;
        out += `<div class="ic-title">CALL A DEVICE</div>`;
        if (keys.length === 0) out += `<div class="ic-empty">No intercom devices found</div>`;
        keys.forEach(k => {
          const name = tc(k.replace(/^ks_/, '').replace(/_intercom_call$/, ''));
          const click = `var h=document.querySelector('home-assistant').hass;h.callService('esphome','${k}',{});${close}`;
          out += `<div class="ic-row" onclick="${click}"><span class="ic-ph">${PHONE}</span><span>${name}</span></div>`;
        });
        out += `<div class="ic-close" onclick="${close}">CLOSE</div>`;
        out += `</div>`;
        return out;
      ]]]
  styles:
    card:
      - position: fixed
      - top: 0px
      - left: 0px
      - width: 100vw
      - height: 100vh
      - padding: 0px
      - margin: 0px
      - border: none
      - border-radius: 0px
      - background: rgba(0, 0, 0, 0.55)
      - box-shadow: none
      - display: flex
      - align-items: center
      - justify-content: center
      - z-index: '99'
    grid:
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
    custom_fields:
      list:
        - width: min(92vw, 420px)
  extra_styles: |
    .ic-wrap { font-family: Antonio, 'Roboto Condensed', sans-serif;
               background: rgba(12,12,12,0.97);
               border: 1px solid rgba(255,255,255,0.12);
               border-radius: 22px; padding: 18px 16px;
               box-shadow: 0 16px 50px rgba(0,0,0,0.65); }
    .ic-title { color: #8b8f93; font-weight: 600; letter-spacing: 3px;
                font-size: 15px; text-align: center; margin: 4px 0 14px; }
    .ic-row { display: flex; align-items: center; gap: 14px;
              padding: 15px 16px; margin: 8px 0; border-radius: 14px;
              background: rgba(255,255,255,0.05); color: #fff;
              font-size: 21px; font-weight: 600; cursor: pointer; }
    .ic-row:active { background: rgba(52,199,89,0.18); }
    .ic-ph { color: #34C759; display: inline-flex; }
    .ic-close { text-align: center; color: #8b8f93; font-weight: 600;
                font-size: 17px; letter-spacing: 2px; padding: 14px; margin-top: 4px;
                cursor: pointer; }
    .ic-empty { color: #777; text-align: center; padding: 24px; font-size: 18px; }
