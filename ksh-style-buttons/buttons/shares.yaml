# KSH Style Button — Shares (navigation)
# Behaviour: ksh_tap_beep template → navigates to /<dashboard>/shares.
# Random up/down/up bar chart with a trend arrow tracing the tops (same weight).
# White lines, green "gains" halo. Requires the ksh_tap_beep template (see templates/).
type: custom:button-card
template: ksh_tap_beep
variables:
  nav: shares
hold_action:
  action: none
aspect_ratio: 1/1
show_name: false
show_state: false
show_icon: false
custom_fields:
  shares_graphic: >
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" class="shares-svg">
      <defs>
        <radialGradient id="sharesHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="var(--halo-color)" stop-opacity="1"></stop>
          <stop offset="55%"  stop-color="var(--halo-color)" stop-opacity="0.9"></stop>
          <stop offset="82%"  stop-color="var(--halo-color)" stop-opacity="0.4"></stop>
          <stop offset="100%" stop-color="var(--halo-color)" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <circle cx="120" cy="120" r="122" fill="url(#sharesHalo)" opacity="var(--halo-op, 0.2)"></circle>
      <line x1="46" y1="186" x2="196" y2="186" fill="none" stroke="var(--shares-color)" stroke-width="1" opacity="0.28" stroke-linecap="round"></line>
      <g fill="none" stroke="var(--shares-color)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="50"  y="115" width="18" height="71"  rx="5"></rect>
        <rect x="82"  y="88"  width="18" height="98"  rx="5"></rect>
        <rect x="114" y="128" width="18" height="58"  rx="5"></rect>
        <rect x="146" y="96"  width="18" height="90"  rx="5"></rect>
        <rect x="178" y="62"  width="18" height="124" rx="5"></rect>
      </g>
      <g fill="none" stroke="var(--shares-color)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="59,115 91,88 123,128 155,96 187,62"></polyline>
        <polyline points="169,62 187,62 187,80"></polyline>
      </g>
    </svg>
styles:
  card:
    - padding: 0px
    - background-color: transparent
    - box-shadow: none
    - border: none
    - overflow: visible
    - --shares-color: '#FFFFFF'
    - --halo-color: '#34C759'
  grid:
    - position: relative
  custom_fields:
    shares_graphic:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 100%
      - height: 100%
      - --halo-op: '0.2'
extra_styles: |
  .shares-svg { width: 100%; height: 100%; display: block; overflow: visible; }
