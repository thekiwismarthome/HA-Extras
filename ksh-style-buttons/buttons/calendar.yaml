# KSH Style Button — Calendar (live date)  ·  CSS-only, max-compatibility build
# =============================================================================
#  No svg, no custom_fields — the calendar is drawn with plain CSS so it works
#  on old tablet webviews (needs a current button-card; older ones ignore
#  `styles`). The bordered box is INSET (card padding) so it matches the
#  footprint of the other KSH icons instead of filling the whole tile.
#    - day number -> native `name`  text template
#    - month      -> native `label` text template
#    - body/band  -> styles.grid border + background gradient (inner box)
#
#  Tap = set the kitchen tablet's calendar view to "Schedule".
#  Size: tweak `padding` on styles.card (bigger % = smaller calendar).
# =============================================================================
type: custom:button-card
aspect_ratio: 1/1
show_icon: false
show_state: false
show_name: true
show_label: true
name: |
  [[[ return new Date().getDate().toString(); ]]]
label: |
  [[[
    const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return M[new Date().getMonth()];
  ]]]
tap_action:
  action: call-service
  service: select.select_option
  target:
    entity_id: select.kitchen_kitchen_tablet_calendar_view
  data:
    option: Schedule
hold_action:
  action: none
styles:
  card:
    - padding: 12%            # inset -> inner box ~76% of the tile (match other icons)
    - background-color: transparent
    - box-shadow: none
    - border: none
  grid:
    - position: relative
    - width: 100%
    - height: 100%
    - box-sizing: border-box
    - border: '4px solid #FFFFFF'
    - border-radius: 16px
    - background: 'linear-gradient(#FFFFFF 0, #FFFFFF 26%, rgba(0,0,0,0) 26%)'
    - box-shadow: '0 0 12px rgba(255, 255, 255, 0.18)'
    - overflow: visible
  name:
    - position: absolute
    - top: 62%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - font-family: Antonio, sans-serif
    - font-weight: '700'
    - font-size: 48px
    - line-height: '1'
    - color: '#FFFFFF'
    - text-align: center
  label:
    - position: absolute
    - top: 13%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - font-family: Antonio, sans-serif
    - font-weight: '700'
    - font-size: 14px
    - letter-spacing: 2px
    - color: '#000000'
    - text-align: center
