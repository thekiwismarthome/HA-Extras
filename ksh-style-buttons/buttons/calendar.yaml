# KSH Style Button — Calendar (live date)  ·  tablet-safe build
# =============================================================================
#  Your tablet webview won't render SVG returned from a [[[ ]]] template, but it
#  DOES render: (a) a static SVG custom_field, and (b) button-card name/label
#  TEXT templates. So this tile is built only from those:
#    - static SVG frame (calendar body + white month band + faded halo)
#    - day number  -> native `name`  text template
#    - month       -> native `label` text template
#
#  Tap = set the kitchen tablet's calendar view to "Schedule".
# =============================================================================
type: custom:button-card
aspect_ratio: 1/1
show_icon: false
show_state: false
show_name: true
show_label: true
name: |
  [[[ return new Date().getDate().toString(); ]]]
label: |
  [[[
    const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return M[new Date().getMonth()];
  ]]]
tap_action:
  action: call-service
  service: select.select_option
  target:
    entity_id: select.kitchen_kitchen_tablet_calendar_view
  data:
    option: Schedule
hold_action:
  action: none
custom_fields:
  cal_frame: >
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" class="cal-svg">
      <defs>
        <radialGradient id="calHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--cal-color)" stop-opacity="0.22"></stop>
          <stop offset="45%" stop-color="var(--cal-color)" stop-opacity="0.11"></stop>
          <stop offset="78%" stop-color="var(--cal-color)" stop-opacity="0.03"></stop>
          <stop offset="100%" stop-color="var(--cal-color)" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <circle cx="120" cy="120" r="122" fill="url(#calHalo)"></circle>
      <rect x="82" y="48" width="12" height="30" rx="6" fill="none" stroke="var(--cal-color)" stroke-width="4"></rect>
      <rect x="146" y="48" width="12" height="30" rx="6" fill="none" stroke="var(--cal-color)" stroke-width="4"></rect>
      <rect x="50" y="62" width="140" height="132" rx="22" fill="none" stroke="var(--cal-color)" stroke-width="4"></rect>
      <path d="M50 94 V84 a22 22 0 0 1 22 -22 H168 a22 22 0 0 1 22 22 V94 Z" fill="var(--cal-color)"></path>
    </svg>
styles:
  card:
    - padding: 0px
    - background-color: transparent
    - box-shadow: none
    - border: none
    - position: relative
    - overflow: visible
  grid:
    - position: relative
    - overflow: visible
  name:
    - position: absolute
    - top: 58%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - z-index: 2
    - font-family: Antonio, 'Roboto Condensed', sans-serif
    - font-weight: '700'
    - font-size: 56px
    - line-height: 1
    - color: var(--cal-color)
    - text-align: center
  label:
    - position: absolute
    - top: 32%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - z-index: 2
    - font-family: Antonio, 'Roboto Condensed', sans-serif
    - font-weight: '700'
    - font-size: 16px
    - letter-spacing: 3px
    - color: var(--card-background-color, '#000000')
    - text-align: center
  custom_fields:
    cal_frame:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 100%
      - height: 100%
      - z-index: 0
      - overflow: visible
      - --card-background-color: '#000000'
      - --cal-color: '#FFFFFF'
      - filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.18))
extra_styles: |
  .cal-svg { width: 100%; height: 100%; display: block; overflow: visible; }
