# KSH Style Button — Calendar (live date)  ·  CSS-only, max-compatibility build
# =============================================================================
#  Your button-card renders name/label TEXT but was ignoring `styles` and
#  `custom_fields` (and inline SVG) — the classic sign of an OUTDATED
#  custom:button-card. Update it in HACS (Frontend -> Button Card -> update)
#  and hard-refresh / clear the tablet's cache.
#
#  This build uses NO svg and NO custom_fields — the whole calendar is drawn
#  with plain CSS (border + white gradient band) so it renders on old tablet
#  webviews once button-card itself is current:
#    - day number -> native `name`  text template
#    - month      -> native `label` text template
#    - body/band  -> styles.card border + background gradient
#
#  Tap = set the kitchen tablet's calendar view to "Schedule".
# =============================================================================
type: custom:button-card
aspect_ratio: 1/1
show_icon: false
show_state: false
show_name: true
show_label: true
name: |
  [[[ return new Date().getDate().toString(); ]]]
label: |
  [[[
    const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return M[new Date().getMonth()];
  ]]]
tap_action:
  action: call-service
  service: select.select_option
  target:
    entity_id: select.kitchen_kitchen_tablet_calendar_view
  data:
    option: Schedule
hold_action:
  action: none
styles:
  card:
    - padding: 0px
    - position: relative
    - border: '4px solid #FFFFFF'
    - border-radius: 20px
    - background: 'linear-gradient(#FFFFFF 0, #FFFFFF 26%, rgba(0,0,0,0) 26%)'
    - box-shadow: '0 0 12px rgba(255, 255, 255, 0.18)'
  name:
    - position: absolute
    - top: 62%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - font-family: Antonio, sans-serif
    - font-weight: '700'
    - font-size: 64px
    - line-height: '1'
    - color: '#FFFFFF'
    - text-align: center
  label:
    - position: absolute
    - top: 13%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - font-family: Antonio, sans-serif
    - font-weight: '700'
    - font-size: 18px
    - letter-spacing: 3px
    - color: '#000000'
    - text-align: center
