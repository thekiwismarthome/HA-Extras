# KSH Style Button — Calendar (live date)  ·  CSS-only, max-compatibility build
# =============================================================================
#  No svg, no custom_fields — drawn with plain CSS so it works on old tablet
#  webviews (needs a current button-card; older ones ignore `styles`).
#
#  The border/band are on the CARD (the layout that positions the number
#  correctly), and the whole card is scaled to ~80% so it matches the
#  footprint of the other KSH icons instead of filling the tile.
#    - day number -> native `name`  text template
#    - month      -> native `label` text template (on the white band)
#
#  Tap  = set the kitchen tablet's calendar view to "Schedule".
#  Size = `transform: scale(0.8)` on styles.card (lower = smaller).
#  Don't want the month? set `show_label: false`.
# =============================================================================
type: custom:button-card
aspect_ratio: 1/1
show_icon: false
show_state: false
show_name: true
show_label: true
name: |
  [[[ return new Date().getDate().toString(); ]]]
label: |
  [[[
    const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return M[new Date().getMonth()];
  ]]]
tap_action:
  action: call-service
  service: select.select_option
  target:
    entity_id: select.kitchen_kitchen_tablet_calendar_view
  data:
    option: Schedule
hold_action:
  action: none
styles:
  card:
    - padding: 0px
    - position: relative
    - transform: scale(0.8)          # shrink to icon size (lower = smaller)
    - transform-origin: center
    - border: '4px solid #FFFFFF'
    - border-radius: 20px
    - background: 'linear-gradient(#FFFFFF 0, #FFFFFF 26%, rgba(0,0,0,0) 26%)'
    - box-shadow: '0 0 12px rgba(255, 255, 255, 0.18)'
  name:
    - position: absolute
    - top: 62%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - font-family: Antonio, sans-serif
    - font-weight: '700'
    - font-size: 60px
    - line-height: '1'
    - color: '#FFFFFF'
    - text-align: center
  label:
    - position: absolute
    - top: 13%
    - left: 0px
    - right: 0px
    - transform: translateY(-50%)
    - font-family: Antonio, sans-serif
    - font-weight: '700'
    - font-size: 18px
    - letter-spacing: 3px
    - color: '#000000'
    - text-align: center
