type: custom:button-card
entity: light.lounge_dimmer_2
aspect_ratio: 1/1
show_name: false
show_state: false
show_icon: false
tap_action:
  action: javascript
  haptic: heavy
  javascript: |
    [[[
      try {
        const ctx = window.__haClickCtx || (window.__haClickCtx = new (window.AudioContext || window.webkitAudioContext)());
        if (ctx.state === 'suspended') ctx.resume();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.frequency.value = 900;
        g.gain.setValueAtTime(0.25, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.05);
      } catch (e) {}
      hass.callService('light', 'toggle', { entity_id: entity.entity_id });
    ]]]
hold_action:
  action: more-info
custom_fields:
  light_graphic: >
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"
    class="light-svg">
      <circle cx="120" cy="120" r="var(--halo-r, 104)" class="halo" fill="var(--light-color)" opacity="var(--halo-op, 0)"></circle>
      <circle cx="120" cy="120" r="66" class="aperture-glow" fill="var(--light-color)" opacity="var(--aperture-op, 0)"></circle>
      <g class="fixture">
        <circle cx="120" cy="120" r="94" fill="none" stroke="var(--light-color)" stroke-width="var(--stroke-main, 2.5)"></circle>
        <circle cx="120" cy="120" r="86" fill="none" stroke="var(--light-color)" stroke-width="var(--stroke-fine, 0.8)" opacity="var(--fine-op, 0.25)"></circle>
        <circle cx="120" cy="120" r="66" fill="none" stroke="var(--light-color)" stroke-width="var(--stroke-main, 2.5)"></circle>
        <circle cx="120" cy="120" r="58" fill="none" stroke="var(--light-color)" stroke-width="var(--stroke-fine, 0.8)" opacity="var(--fine-op-2, 0.3)"></circle>
        <path d="M76 120 A44 44 0 0 1 120 76" fill="none" stroke="var(--light-color)" stroke-width="var(--stroke-main, 2.5)" stroke-linecap="round" class="bevel"></path>
      </g>
    </svg>
styles:
  card:
    - padding: 0px
    - background-color: transparent
    - box-shadow: none
    - border: none
  grid:
    - position: relative
  custom_fields:
    light_graphic:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 110%
      - height: 110%
      - --card-background-color: '#000000'
      - --light-color: |
          [[[
            if (entity.state !== 'on') return '#FFFFFF';
            const p = (entity.attributes.brightness || 255) / 255;
            const r = Math.round(224 + p * 31);
            const g = Math.round(140 + p * 100);
            const b = Math.round(30  + p * 166);
            return 'rgb(' + r + ',' + g + ',' + b + ')';
          ]]]
      - --stroke-main: |
          [[[
            if (entity.state !== 'on') return '3.4';
            const p = (entity.attributes.brightness || 255) / 255;
            return (3.4 + p * 1.2).toFixed(2);
          ]]]
      - --stroke-fine: |
          [[[
            if (entity.state !== 'on') return '1.2';
            const p = (entity.attributes.brightness || 255) / 255;
            return (1.2 + p * 0.2).toFixed(2);
          ]]]
      - --fine-op: |
          [[[
            if (entity.state !== 'on') return '0.45';
            const p = (entity.attributes.brightness || 255) / 255;
            return (0.45 + p * 0.15).toFixed(2);
          ]]]
      - --fine-op-2: |
          [[[
            if (entity.state !== 'on') return '0.5';
            const p = (entity.attributes.brightness || 255) / 255;
            return (0.5 + p * 0.15).toFixed(2);
          ]]]
      - --aperture-op: |
          [[[
            if (entity.state !== 'on') return '0';
            const p = (entity.attributes.brightness || 255) / 255;
            return (0.05 + p * 0.21).toFixed(3);
          ]]]
      - --halo-op: |
          [[[
            if (entity.state !== 'on') return '0';
            const p = (entity.attributes.brightness || 255) / 255;
            return (0.04 + p * 0.13).toFixed(3);
          ]]]
      - --halo-r: |
          [[[
            if (entity.state !== 'on') return '104';
            const p = (entity.attributes.brightness || 255) / 255;
            return (104 + p * 14).toFixed(0);
          ]]]
      - filter: |
          [[[
            if (entity.state !== 'on') return 'none';
            const p = (entity.attributes.brightness || 255) / 255;
            return 'drop-shadow(0 0 ' + (3 + p * 16).toFixed(1) + 'px rgba(255,214,130,' + (0.2 + p * 0.55).toFixed(2) + '))';
          ]]]
extra_styles: >
  .light-svg { width: 100%; height: 100%; display: block; }


  .fixture circle, .fixture path { transition: stroke .45s ease,
  stroke-width .45s ease, opacity .45s ease; }

  .aperture-glow, .halo { transition: opacity .45s ease, r .45s ease; }
