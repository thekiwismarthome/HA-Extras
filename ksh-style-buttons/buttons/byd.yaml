# KSH Style Button — BYD (EV)  ·  STATIC / no-JavaScript version
# =============================================================================
#  A pure inline-SVG tile like climate.yaml / home.yaml — no [[[ ]]] templates
#  anywhere, so it renders on any button-card setup. Colour + glow are driven
#  by button-card `state:` blocks off the battery %.
#
#  entity   = your BYD state-of-charge sensor (a number 0-100).
#             Change it to match your car if yours differs.
#  Colour   : >=60 green · 30-59 amber · <30 red · non-numeric = grey.
#  Tap      = more-info. (Swap to a navigate action — see the note below.)
#
#  Next step (once this renders): layer the live % readout, SOC gauge ring and
#  charging animation back on. Those need button-card JS templates working —
#  we'll sort that separately.
# =============================================================================
type: custom:button-card
entity: sensor.byd_sealion_7_charge_state
aspect_ratio: 1/1
show_name: false
show_state: false
show_icon: false
tap_action:
  action: more-info
  # To make it a navigation tile instead, replace the two lines above with:
  #   action: navigate
  #   navigation_path: /byd        # <- your BYD view's path
hold_action:
  action: more-info
custom_fields:
  byd_graphic: >
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" class="byd-svg">
      <circle cx="120" cy="120" r="110" fill="var(--byd-color)" opacity="var(--halo-op, 0.06)"></circle>
      <circle cx="120" cy="120" r="94" fill="none" stroke="var(--byd-color)" stroke-width="3.4"></circle>
      <circle cx="120" cy="120" r="86" fill="none" stroke="var(--byd-color)" stroke-width="1.2" opacity="0.4"></circle>
      <g class="car" transform="translate(0,6)">
        <path d="M52 128 L52 118 Q53 111 62 109 L86 103 L100 84 Q104 79 112 79 L146 79 Q156 79 162 88 L176 106 L186 109 Q194 111 194 120 L194 128 Z" fill="var(--card-background-color, #000)" stroke="var(--byd-color)" stroke-width="3.5" stroke-linejoin="round"></path>
        <path d="M124 80 L124 103" fill="none" stroke="var(--byd-color)" stroke-width="2.2" opacity="0.5"></path>
        <path d="M104 101 L114 86 Q116 83 121 83 L121 101 Z" fill="none" stroke="var(--byd-color)" stroke-width="0.9" opacity="0.3"></path>
        <path d="M127 83 L143 83 Q150 83 155 90 L162 100 L127 101 Z" fill="none" stroke="var(--byd-color)" stroke-width="0.9" opacity="0.3"></path>
        <path d="M74 128 L172 128" fill="none" stroke="var(--byd-color)" stroke-width="2.2" opacity="0.35"></path>
        <circle cx="86" cy="130" r="16" fill="var(--card-background-color, #000)" stroke="var(--byd-color)" stroke-width="3.4"></circle>
        <circle cx="86" cy="130" r="6" fill="none" stroke="var(--byd-color)" stroke-width="2.2" opacity="0.6"></circle>
        <circle cx="160" cy="130" r="16" fill="var(--card-background-color, #000)" stroke="var(--byd-color)" stroke-width="3.4"></circle>
        <circle cx="160" cy="130" r="6" fill="none" stroke="var(--byd-color)" stroke-width="2.2" opacity="0.6"></circle>
      </g>
    </svg>
styles:
  card:
    - padding: 0px
    - background-color: transparent
    - box-shadow: none
    - border: none
  grid:
    - position: relative
  custom_fields:
    byd_graphic:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 100%
      - height: 100%
      - --card-background-color: '#000000'
      - --byd-color: '#6B6E70'
      - --halo-op: '0.06'
extra_styles: |
  .byd-svg { width: 100%; height: 100%; display: block; }
# --- colour + glow by battery % (ascending thresholds; higher band wins) ---
state:
  - operator: '>='
    value: 0
    styles:
      custom_fields:
        byd_graphic:
          - --byd-color: '#FF3B30'
          - --halo-op: '0.10'
          - filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.5))
  - operator: '>='
    value: 30
    styles:
      custom_fields:
        byd_graphic:
          - --byd-color: '#FF9F0A'
          - --halo-op: '0.07'
          - filter: drop-shadow(0 0 8px rgba(255, 159, 10, 0.45))
  - operator: '>='
    value: 60
    styles:
      custom_fields:
        byd_graphic:
          - --byd-color: '#34C759'
          - --halo-op: '0.07'
          - filter: drop-shadow(0 0 8px rgba(52, 199, 89, 0.45))
