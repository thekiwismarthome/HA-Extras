# KSH Style Button — BYD (EV)  ·  STATIC / no-JavaScript version
# =============================================================================
#  A pure inline-SVG tile like climate.yaml / home.yaml — no [[[ ]]] templates
#  anywhere, so it renders on any button-card setup. A sleek fastback coupe-SUV
#  silhouette (aero wheels, soft gradient fill, glow) recoloured by battery %
#  via button-card `state:` blocks.
#
#  entity   = your BYD state-of-charge sensor (a number 0-100).
#             Change it to match your car if yours differs.
#  Colour   : >=60 green · 30-59 amber · <30 red · non-numeric = grey.
#  Tap      = more-info. (Swap to a navigate action — see the note below.)
#
#  Next step (once this renders): layer the live % readout, SOC gauge ring and
#  charging animation back on. Those need button-card JS templates working —
#  we'll sort that separately.
# =============================================================================
type: custom:button-card
entity: sensor.byd_sealion_7_charge_state
aspect_ratio: 1/1
show_name: false
show_state: false
show_icon: false
tap_action:
  action: more-info
  # To make it a navigation tile instead, replace the two lines above with:
  #   action: navigate
  #   navigation_path: /byd        # <- your BYD view's path
hold_action:
  action: more-info
custom_fields:
  byd_graphic: |
    <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" class="byd-svg">
      <defs>
        <linearGradient id="bydFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--byd-color)" stop-opacity="0.26"></stop>
          <stop offset="1" stop-color="var(--byd-color)" stop-opacity="0.04"></stop>
        </linearGradient>
      </defs>
      <circle cx="120" cy="120" r="110" fill="var(--byd-color)" opacity="var(--halo-op, 0.05)"></circle>
      <!-- sleek fastback coupe-SUV silhouette -->
      <path d="M30 148 C30 140 33 137 41 135 L52 132 C60 116 74 104 104 102 C120 101 132 101 150 103 C168 105 180 112 192 124 L206 128 C214 130 216 134 216 141 L216 148 Z" fill="url(#bydFill)" stroke="var(--byd-color)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M56 132 L206 128" fill="none" stroke="var(--byd-color)" stroke-width="1.6" opacity="0.3"></path>
      <path d="M72 128 C78 116 90 108 108 108 L120 108 L120 128 Z" fill="var(--card-background-color, #000)" stroke="var(--byd-color)" stroke-width="2.2" stroke-linejoin="round"></path>
      <path d="M126 108 L146 109 C160 111 170 116 178 126 L126 128 Z" fill="var(--card-background-color, #000)" stroke="var(--byd-color)" stroke-width="2.2" stroke-linejoin="round"></path>
      <path d="M96 122 L112 122" stroke="var(--byd-color)" stroke-width="2" stroke-linecap="round" opacity="0.5"></path>
      <!-- rear aero wheel -->
      <circle cx="78" cy="150" r="24" fill="var(--card-background-color, #000)" stroke="var(--byd-color)" stroke-width="4"></circle>
      <circle cx="78" cy="150" r="15" fill="none" stroke="var(--byd-color)" stroke-width="2" opacity="0.55"></circle>
      <path d="M78 150 L78 136 M78 150 L91.3 145.7 M78 150 L86.2 161.3 M78 150 L69.8 161.3 M78 150 L64.7 145.7" stroke="var(--byd-color)" stroke-width="2" stroke-linecap="round" opacity="0.5"></path>
      <circle cx="78" cy="150" r="3.2" fill="var(--byd-color)"></circle>
      <!-- front aero wheel -->
      <circle cx="176" cy="150" r="24" fill="var(--card-background-color, #000)" stroke="var(--byd-color)" stroke-width="4"></circle>
      <circle cx="176" cy="150" r="15" fill="none" stroke="var(--byd-color)" stroke-width="2" opacity="0.55"></circle>
      <path d="M176 150 L176 136 M176 150 L189.3 145.7 M176 150 L184.2 161.3 M176 150 L167.8 161.3 M176 150 L162.7 145.7" stroke="var(--byd-color)" stroke-width="2" stroke-linecap="round" opacity="0.5"></path>
      <circle cx="176" cy="150" r="3.2" fill="var(--byd-color)"></circle>
      <path d="M46 182 L196 182" stroke="var(--byd-color)" stroke-width="3" stroke-linecap="round" opacity="var(--ground-op, 0.28)"></path>
    </svg>
styles:
  card:
    - padding: 0px
    - background-color: transparent
    - box-shadow: none
    - border: none
  grid:
    - position: relative
  custom_fields:
    byd_graphic:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 100%
      - height: 100%
      - --card-background-color: '#000000'
      - --byd-color: '#6B6E70'
      - --halo-op: '0.06'
extra_styles: |
  .byd-svg { width: 100%; height: 100%; display: block; }
# --- colour + glow by battery % (ascending thresholds; higher band wins) ---
state:
  - operator: '>='
    value: 0
    styles:
      custom_fields:
        byd_graphic:
          - --byd-color: '#FF3B30'
          - --halo-op: '0.10'
          - filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.5))
  - operator: '>='
    value: 30
    styles:
      custom_fields:
        byd_graphic:
          - --byd-color: '#FF9F0A'
          - --halo-op: '0.07'
          - filter: drop-shadow(0 0 8px rgba(255, 159, 10, 0.45))
  - operator: '>='
    value: 60
    styles:
      custom_fields:
        byd_graphic:
          - --byd-color: '#34C759'
          - --halo-op: '0.07'
          - filter: drop-shadow(0 0 8px rgba(52, 199, 89, 0.45))
