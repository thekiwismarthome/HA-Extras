                - --dry-color: '#00A1E4'
                - --tumble-op: 0.35
                - --heat-op: 0.35
                - filter: drop-shadow(0 0 8px rgba(0, 161, 228, 0.4))
        - value: Idle
          styles:
            custom_fields:
              dryer_graphic:
                - --dry-color: '#FFFFFF'
                - --heat-op: 0.25
        - value: End Of Cycle
          styles:
            custom_fields:
              dryer_graphic:
                - --dry-color: '#B06BFF'
                - --halo-play: running
                - --halo-op: 0.12
                - --heat-op: 0.4
                - animation: dryPulse 1.5s ease-in-out infinite
                - filter: drop-shadow(0 0 12px rgba(176, 107, 255, 0.55))
        - value: Delayed Start
          styles:
            custom_fields:
              dryer_graphic:
                - --dry-color: '#26C6DA'
                - --tumble-op: 0.25
                - --heat-op: 0.25
                - filter: drop-shadow(0 0 8px rgba(38, 198, 218, 0.4))
        - value: Unknown
          styles:
            custom_fields:
              dryer_graphic:
                - --dry-color: '#FF3B30'
                - filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.5))
