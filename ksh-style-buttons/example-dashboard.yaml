          <circle cx="120" cy="120" r="110" class="halo" fill="var(--climate-color)" opacity="0.06"></circle>
          <g class="unit">
            <rect x="38" y="62" width="164" height="63" rx="19" fill="var(--card-background-color, #000)" stroke="var(--climate-color)" stroke-width="3.5"></rect>
            <rect x="46" y="70" width="148" height="47" rx="14" fill="none" stroke="var(--climate-color)" stroke-width="0.8" opacity="0.25"></rect>
            <path d="M38 105 H202" fill="none" stroke="var(--climate-color)" stroke-width="2.5"></path>
            <path d="M62 84 H100" fill="none" stroke="var(--climate-color)" stroke-width="2.5" stroke-linecap="round"></path>
            <path d="M62 93 H88" fill="none" stroke="var(--climate-color)" stroke-width="0.8" opacity="0.3" stroke-linecap="round"></path>
            <circle cx="180" cy="88" r="5" fill="var(--climate-color)" opacity="0.35" class="status-dot"></circle>
          </g>
          <g class="airflow">
            <path d="M82 158 q19 -22 38 0 t38 0" fill="none" stroke="var(--climate-color)" stroke-width="2.5" stroke-linecap="round" class="wave w1"></path>
            <path d="M91 192 q14 -17 29 0 t29 0" fill="none" stroke="var(--climate-color)" stroke-width="2.5" stroke-linecap="round" class="wave w2"></path>
          </g>
        </svg>
    styles:
      card:
        - padding: 0px
        - background-color: transparent
        - box-shadow: none
        - border: none
      grid:
        - position: relative
      custom_fields:
        mode_graphic:
          - position: absolute
          - top: 50%
          - left: 50%
          - transform: translate(-50%, -50%)
          - width: 110%
          - height: 110%
          - --card-background-color: '#000000'
          - --climate-color: '#FFFFFF'
    extra_styles: >
      .climate-svg { width: 100%; height: 100%; display: block; }


      .halo { transform-box: fill-box; transform-origin: center;
              animation: acHalo 3.5s ease-in-out infinite;
              animation-play-state: var(--halo-play, paused); }

      .status-dot { animation: acPulse 2.6s ease-in-out infinite;
                    animation-play-state: var(--dot-play, paused); }


      .wave { opacity: var(--wave-op, 0); transition: opacity .4s; }

      .w1 { animation: acDrift 3.2s ease-in-out infinite;
            animation-play-state: var(--wave-play, paused); }

      .w2 { animation: acDrift 3.2s ease-in-out infinite .5s;
            animation-play-state: var(--wave-play, paused); }


      @keyframes acHalo { 0%, 100% { opacity: .04; } 50% { opacity: .13; } }

      @keyframes acPulse { 0%, 100% { opacity: .25; } 50% { opacity: .6; } }

      @keyframes acDrift { 0%, 100% { transform: translateY(0); } 50% {
      transform: translateY(5px); } }
    state:
      - value: heat
        styles:
          custom_fields:
            mode_graphic:
              - --climate-color: '#FF6B35'
              - --halo-play: running
              - --dot-play: running
              - --wave-play: running
              - --wave-op: 1
              - filter: drop-shadow(0 0 8px rgba(255, 107, 53, 0.55))
      - value: cool
        styles:
          custom_fields:
            mode_graphic:
              - --climate-color: '#00A1E4'
              - --halo-play: running
              - --dot-play: running
              - --wave-play: running
              - --wave-op: 1
              - filter: drop-shadow(0 0 8px rgba(0, 161, 228, 0.55))
      - value: dry
        styles:
          custom_fields:
            mode_graphic:
              - --climate-color: '#26C6DA'
              - --halo-play: running
              - --dot-play: running
              - --wave-play: running
              - --wave-op: 1
              - filter: drop-shadow(0 0 8px rgba(38, 198, 218, 0.5))
      - value: auto
        styles:
          custom_fields:
            mode_graphic:
              - --climate-color: '#34C759'
              - --halo-play: running
              - --dot-play: running
              - --wave-play: running
              - --wave-op: 1
              - filter: drop-shadow(0 0 8px rgba(52, 199, 89, 0.5))
      - value: 'off'
        styles:
          custom_fields:
            mode_graphic:
              - --climate-color: '#FFFFFF'
              - --wave-op: 1
  - type: custom:button-card
    entity: vacuum.wall_e
    triggers_update:
      - binary_sensor.wall_e_bin_full
    aspect_ratio: 1/1
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: javascript
      haptic: heavy
      javascript: |
        [[[
          try {
            const ctx = window.__haClickCtx || (window.__haClickCtx = new (window.AudioContext || window.webkitAudioContext)());
            if (ctx.state === 'suspended') ctx.resume();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.frequency.value = 900;
            g.gain.setValueAtTime(0.25, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.05);
          } catch (e) {}
          const s = entity.state;
          let svc = 'start';
          if (s === 'cleaning' || s === 'returning') svc = 'pause';
          else if (s === 'error') svc = 'locate';
          hass.callService('vacuum', svc, { entity_id: entity.entity_id });
        ]]]
    hold_action:
      action: more-info
    custom_fields:
      vacuum_graphic: >
        <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"
        class="vacuum-svg">
          <circle cx="120" cy="120" r="110" class="glow" fill="var(--vacuum-color)" opacity="0.06"></circle>
          <g class="vacuum-body-rotate">
            <g class="vacuum-body">
              <g class="brush brush-right">
                <g class="brush-spokes">
                  <line x1="174" y1="76" x2="174" y2="64" stroke="var(--vacuum-color)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"></line>
                  <line x1="174" y1="76" x2="174" y2="88" stroke="var(--vacuum-color)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"></line>
                  <line x1="174" y1="76" x2="162" y2="76" stroke="var(--vacuum-color)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"></line>
                  <line x1="174" y1="76" x2="186" y2="76" stroke="var(--vacuum-color)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"></line>
                </g>
                <circle cx="174" cy="76" r="2" fill="var(--vacuum-color)" opacity="0.5"></circle>
              </g>
              <circle cx="120" cy="120" r="72" fill="var(--card-background-color, #fff)" stroke="var(--vacuum-color)" stroke-width="3.5"></circle>
              <circle cx="120" cy="120" r="66" fill="none" stroke="var(--vacuum-color)" stroke-width="0.8" opacity="0.2"></circle>
              <path d="M 60 94 A 68 68 0 0 1 180 94" fill="none" stroke="var(--vacuum-color)" stroke-width="2.5" stroke-linecap="round" class="bumper"></path>
              <g class="nav-lines" opacity="0.15">
                <line x1="120" y1="56" x2="120" y2="74" stroke="var(--vacuum-color)" stroke-width="1.5"></line>
                <line x1="88" y1="63" x2="96" y2="78" stroke="var(--vacuum-color)" stroke-width="1.5"></line>
                <line x1="152" y1="63" x2="144" y2="78" stroke="var(--vacuum-color)" stroke-width="1.5"></line>
              </g>
              <circle cx="120" cy="108" r="14" fill="var(--card-background-color, #fff)" stroke="var(--vacuum-color)" stroke-width="2.5" class="lidar-housing"></circle>
              <circle cx="120" cy="108" r="9" fill="none" stroke="var(--vacuum-color)" stroke-width="0.8" opacity="0.25"></circle>
              <circle cx="120" cy="140" r="8" fill="var(--vacuum-color)" opacity="0.08" class="power-ring"></circle>
              <circle cx="120" cy="140" r="4" fill="var(--vacuum-color)" opacity="0.25" class="power-dot"></circle>
            </g>
          </g>
          <g class="particles">
            <circle class="particle p1" cx="120" cy="120" r="2" fill="var(--vacuum-color)"></circle>
            <circle class="particle p2" cx="120" cy="120" r="1.5" fill="var(--vacuum-color)"></circle>
            <circle class="particle p3" cx="120" cy="120" r="1.5" fill="var(--vacuum-color)"></circle>
            <circle class="particle p4" cx="120" cy="120" r="2" fill="var(--vacuum-color)"></circle>
            <circle class="particle p5" cx="120" cy="120" r="1.5" fill="var(--vacuum-color)"></circle>
            <circle class="particle p6" cx="120" cy="120" r="1.5" fill="var(--vacuum-color)"></circle>
            <circle class="particle p7" cx="120" cy="120" r="1" fill="var(--vacuum-color)"></circle>
            <circle class="particle p8" cx="120" cy="120" r="1" fill="var(--vacuum-color)"></circle>
          </g>
          <g class="dock-indicator">
            <rect x="76" y="188" width="88" height="28" rx="8" fill="var(--card-background-color, #fff)" stroke="var(--vacuum-color)" stroke-width="3.5"></rect>
          </g>
          <g class="return-path">
            <polygon points="120,220 110,206 130,206" fill="var(--vacuum-color)" stroke="var(--vacuum-color)" stroke-width="3.5" stroke-linejoin="round" opacity="0.55"></polygon>
          </g>
        </svg>
    styles:
      card:
        - padding: 0px
        - background-color: transparent
        - box-shadow: none
        - border: none
      grid:
        - position: relative
      custom_fields:
        vacuum_graphic:
          - position: absolute
          - top: 50%
          - left: 50%
          - transform: translate(-50%, -50%)
          - width: 110%
          - height: 110%
          - --vacuum-color: '#D2D2D2'
          - --card-background-color: '#000000'
    state:
      - operator: template
        value: '[[[ return states[''binary_sensor.wall_e_bin_full''].state === ''on''; ]]]'
        styles:
          custom_fields:
            vacuum_graphic:
              - --vacuum-color: '#FF9F0A'
              - --body-fx: vacPulse 2.5s ease-in-out infinite
      - value: cleaning
        styles:
          custom_fields:
            vacuum_graphic:
              - --vacuum-color: '#00A1E4'
              - --brush-play: running
              - --nav-play: running
              - --glow-play: running
              - --particles-op: 1
              - --particles-play: running
      - value: returning
        styles:
          custom_fields:
            vacuum_graphic:
              - --vacuum-color: '#7E8083'
              - --brush-play: running
              - --dock-op: 1
              - --return-op: 1
      - value: docked
        styles:
          custom_fields:
            vacuum_graphic:
              - --vacuum-color: '#FFFFFF'
              - --dock-op: 1
      - value: error
        styles:
          custom_fields:
            vacuum_graphic:
              - --vacuum-color: '#FF3B30'
              - --body-fx: vacBlink 1s steps(2) infinite
    extra_styles: >
      .vacuum-svg { width: 100%; height: 100%; display: block; }


      .glow { transform-box: fill-box; transform-origin: center;
              animation: vacGlow 3s ease-in-out infinite; animation-play-state: var(--glow-play, paused); }
      .brush-spokes { transform-box: fill-box; transform-origin: center;
                      animation: vacSpin 1.6s linear infinite; animation-play-state: var(--brush-play, paused); }
      .vacuum-body-rotate { transform-box: view-box; transform-origin: 120px
      120px;
                            animation: vacTurn 7s ease-in-out infinite; animation-play-state: var(--nav-play, paused); }
      .vacuum-body { animation: var(--body-fx, none); }


      .particles { opacity: var(--particles-op, 0); transition: opacity .3s; }

      .particle { transform-box: fill-box; animation: vacSuck 1.8s ease-in
      infinite;
                  animation-play-state: var(--particles-play, paused); }
      .p1 { --dx: 60px;  --dy: -40px; animation-delay: 0s; }

      .p2 { --dx: -55px; --dy: 35px;  animation-delay: .35s; }

      .p3 { --dx: 45px;  --dy: 55px;  animation-delay: .7s; }

      .p4 { --dx: -60px; --dy: -30px; animation-delay: 1.05s; }

      .p5 { --dx: 30px;  --dy: -60px; animation-delay: .5s; }

      .p6 { --dx: -40px; --dy: -52px; animation-delay: .9s; }

      .p7 { --dx: 58px;  --dy: 22px;  animation-delay: .2s; }

      .p8 { --dx: -25px; --dy: 60px;  animation-delay: 1.2s; }


      .dock-indicator { opacity: var(--dock-op, 0); transition: opacity .3s; }

      .return-path { opacity: var(--return-op, 0); transition: opacity .3s; }


      @keyframes vacSpin { to { transform: rotate(360deg); } }

      @keyframes vacTurn { 0%, 100% { transform: rotate(0deg); } 30% {
      transform: rotate(-12deg); } 70% { transform: rotate(12deg); } }

      @keyframes vacGlow { 0%, 100% { opacity: .04; } 50% { opacity: .14; } }

      @keyframes vacSuck { 0% { transform: translate(var(--dx), var(--dy));
      opacity: 0; } 22% { opacity: .85; } 100% { transform: translate(0, 0);
      opacity: 0; } }

      @keyframes vacBlink { 50% { opacity: .25; } }

      @keyframes vacPulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
