# RNZ read-aloud — play button (Kiwi style)
# Tap  = read the currently-selected story aloud (pyscript -> HA Cloud TTS -> VACA).
# Hold = stop reading.
# Icon glows blue while that player is speaking.
#
# Depends on the pyscript service pyscript.rnz_read_aloud (rnz_read_aloud.py),
# the input_text.rnz_selected_url helper, and the news card's
# `select_helper: input_text.rnz_selected_url`.
#
# >>> Replace media_player.REPLACE_WITH_VACA_PLAYER in ALL THREE places below.

type: custom:button-card
entity: media_player.REPLACE_WITH_VACA_PLAYER   # only used to glow while playing
aspect_ratio: 1/1
show_name: false
show_state: false
show_icon: false

tap_action:
  action: call-service
  service: pyscript.rnz_read_aloud
  data:
    player: media_player.REPLACE_WITH_VACA_PLAYER
hold_action:
  action: call-service
  service: media_player.media_stop
  target:
    entity_id: media_player.REPLACE_WITH_VACA_PLAYER

# Speaker + sound-waves graphic, defined once. currentColor recolors per state.
custom_fields:
  tts_graphic: |
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%">
      <path d="M22 40 H34 L50 28 V72 L34 60 H22 Z"/>
      <path d="M60 40 q7 10 0 20"/>
      <path d="M69 32 q13 18 0 36"/>
    </svg>

styles:
  card:
    - padding: 0px
    - background-color: "#000000"
  grid:
    - position: relative
  custom_fields:
    tts_graphic:
      - position: absolute
      - top: 50%
      - left: 50%
      - transform: translate(-50%, -50%)
      - width: 85%
      - height: 85%
      - color: "#6B6E70"          # idle — dim grey

state:
  - value: playing
    styles:
      custom_fields:
        tts_graphic:
          - color: "#00A1E4"       # speaking — blue
          - filter: drop-shadow(0 0 8px rgba(0, 161, 228, 0.55))
