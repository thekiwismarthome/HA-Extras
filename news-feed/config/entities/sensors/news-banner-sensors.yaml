# News Headlines — feedparser. One sensor per file for entities/sensors/ (!include_dir_list).
platform: feedparser
name: News Headlines
feed_url: "https://www.rnz.co.nz/rss/national.xml"
date_format: "%a, %d %b %Y %H:%M:%S %z"   # keep year + tz so the card parses exact ages
show_topn: 20
inclusions:
  - title
  - link
  - published
scan_interval:
  minutes: 30
