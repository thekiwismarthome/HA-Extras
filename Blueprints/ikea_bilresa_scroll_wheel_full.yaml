blueprint:
  name: IKEA BILRESA Scroll Wheel – Full Controller (device select)
  description: >
    One automation for the whole IKEA BILRESA scroll wheel (Matter), selected by
    DEVICE rather than by listing its nine button entities.

    Per group, on the light/switch you assign to it:
      • Single press  → toggle
      • Double press  → 100% white (colour bulbs only, optional)
      • Hold          → cycle through a colour palette while held (colour bulbs only, optional)
      • Scroll        → proportional, eased brightness (lights only)

    HOW IT FINDS THE BUTTONS: the remote exposes no device triggers, only nine
    event.*_button_1 … _9 entities. HA can't template a state trigger's entity
    list from a device, so this listens for state changes and filters to the
    device's event entities in a condition. Trade-off: the trigger wakes on every
    state change in HA and filters — heavier than the entity-list version, but
    one-click to set up. If your instance is very chatty, prefer the entity-list
    variant.

    Group and role are derived from each button's trailing number (1–3 = group 1,
    4–6 = group 2, 7–9 = group 3; within a group: two scroll directions + press),
    so this assumes entity IDs end in that number (HA default naming).
    Leave a group's target blank to disable it.
  domain: automation
  source_url: https://claude.ai/  # replace with your own gist URL if you publish it
  input:
    remote_section:
      name: Remote
      icon: mdi:remote
      collapsed: false
      input:
        remote_device:
          name: BILRESA remote
          description: Pick the scroll-wheel remote (only devices with an event entity are shown).
          selector:
            device:
              entity:
                - domain: event

    groups_section:
      name: Groups – what each product group controls
      icon: mdi:lightbulb-group
      collapsed: false
      input:
        group1_target:
          name: Group 1 target (buttons 1–3)
          description: Light or switch. Leave blank if unused.
          default:
          selector:
            entity:
              domain:
                - light
                - switch
        group2_target:
          name: Group 2 target (buttons 4–6)
          description: Light or switch. Leave blank if unused.
          default:
          selector:
            entity:
              domain:
                - light
                - switch
        group3_target:
          name: Group 3 target (buttons 7–9)
          description: Light or switch. Leave blank if unused.
          default:
          selector:
            entity:
              domain:
                - light
                - switch

    behaviour_section:
      name: Behaviour options
      icon: mdi:tune
      collapsed: true
      input:
        colours:
          name: Colour palette
          description: >
            RGB colours the hold-cycle steps through, in order. Add or remove
            freely – the cycle adapts to the list length.
          default:
            - [255, 0, 0]
            - [255, 70, 0]
            - [255, 200, 0]
            - [0, 255, 0]
            - [0, 255, 255]
            - [0, 0, 255]
            - [150, 0, 255]
            - [255, 0, 255]
            - [255, 105, 180]
            - [255, 180, 120]
          selector:
            object:
        cycle_interval:
          name: Colour cycle interval (seconds)
          description: How long each colour is shown while holding.
          default: 1.5
          selector:
            number:
              min: 0.2
              max: 10
              step: 0.1
              unit_of_measurement: s
              mode: box
        dim_step:
          name: Dim step per notch (%)
          description: Brightness change per scroll notch. Scaled by how far you scroll.
          default: 5
          selector:
            number:
              min: 1
              max: 25
              step: 1
              unit_of_measurement: "%"
              mode: slider
        white_brightness:
          name: Double-press white brightness (%)
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        invert_scroll:
          name: Invert scroll direction
          description: >
            By default the lower-numbered scroll button of each pair (1, 4, 7)
            brightens. Turn on to swap brighten/dim.
          default: false
          selector:
            boolean:
        enable_double_white:
          name: Enable double-press → white
          default: true
          selector:
            boolean:
        enable_hold_cycle:
          name: Enable hold → colour cycle
          default: true
          selector:
            boolean:

mode: parallel
max: 10
max_exceeded: silent

variables:
  remote_device: !input remote_device
  colours: !input colours
  cycle_interval: !input cycle_interval
  dim_step: !input dim_step
  white_brightness: !input white_brightness
  invert_scroll: !input invert_scroll
  enable_double_white: !input enable_double_white
  enable_hold_cycle: !input enable_hold_cycle
  g1: !input group1_target
  g2: !input group2_target
  g3: !input group3_target
  # ---- derived from the button that fired ----
  fired: "{{ trigger.event.data.entity_id }}"
  et: >-
    {% set ns = trigger.event.data.new_state %}
    {{ ns.attributes.event_type if ns is not none and 'event_type' in ns.attributes else 'none' }}
  notches: >-
    {% set ns = trigger.event.data.new_state %}
    {{ [ (ns.attributes.totalNumberOfPressesCounted | default(1) | int(1)) if ns is not none else 1, 8 ] | min }}
  pos: "{{ fired.split('_')[-1] | int(0) }}"
  group: "{{ ((pos - 1) // 3) + 1 if pos in range(1, 10) else 0 }}"
  slot: "{{ ((pos - 1) % 3) + 1 if pos in range(1, 10) else 0 }}"
  target: "{{ [g1, g2, g3][group - 1] if group in [1, 2, 3] else none }}"
  is_light: "{{ target is not none and target.startswith('light.') }}"
  supports_colour: >-
    {{ is_light and (state_attr(target, 'supported_color_modes') or [])
       | select('in', ['rgb', 'rgbw', 'rgbww', 'hs', 'xy']) | list | count > 0 }}
  brighten: "{{ (slot == 1) != invert_scroll }}"

triggers:
  - trigger: event
    event_type: state_changed

conditions:
  # Only this remote's button (event) entities
  - condition: template
    value_template: >
      {{ trigger.event.data.new_state is not none
         and fired.startswith('event.')
         and fired in device_entities(remote_device) }}
  # Valid state
  - condition: template
    value_template: >
      {{ trigger.event.data.new_state.state not in ['unknown', 'unavailable', ''] }}
  # Only events we handle (keeps long_release etc. out)
  - condition: template
    value_template: >
      {{ et in ['multi_press_1', 'multi_press_2', 'multi_press_3', 'multi_press_4',
                'multi_press_5', 'multi_press_6', 'multi_press_7', 'multi_press_8',
                'long_press'] }}
  # A target is assigned to this group
  - condition: template
    value_template: "{{ target is not none }}"

actions:
  - choose:
      # ---- Press: single → toggle (works for light or switch) ----
      - conditions:
          - condition: template
            value_template: "{{ slot == 3 and et == 'multi_press_1' }}"
        sequence:
          - action: homeassistant.toggle
            target:
              entity_id: "{{ target }}"

      # ---- Press: double → 100% white (colour bulbs only) ----
      - conditions:
          - condition: template
            value_template: "{{ slot == 3 and et == 'multi_press_2' and enable_double_white and supports_colour }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ target }}"
            data:
              rgb_color: [255, 255, 255]
              brightness_pct: "{{ white_brightness }}"
              transition: 0.4

      # ---- Press: hold → cycle colour while held (colour bulbs only) ----
      - conditions:
          - condition: template
            value_template: "{{ slot == 3 and et == 'long_press' and enable_hold_cycle and supports_colour }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ is_state_attr(fired, 'event_type', 'long_press') }}"
                - condition: template
                  value_template: "{{ repeat.index <= 30 }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ target }}"
                  data:
                    rgb_color: "{{ colours[(repeat.index - 1) % (colours | length)] }}"
                - delay:
                    milliseconds: "{{ (cycle_interval * 1000) | int }}"

      # ---- Scroll: proportional eased dimming (lights only) ----
      - conditions:
          - condition: template
            value_template: "{{ slot in [1, 2] and is_light }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ target }}"
            data:
              brightness_step_pct: "{{ (dim_step * notches) * (1 if brighten else -1) }}"
              transition: 0.4
